name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 格式
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - name: 静态检查
        run: flutter analyze
      - name: 测试
        run: flutter test
      - name: 示例检查
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
